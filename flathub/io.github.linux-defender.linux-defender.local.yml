app-id: io.github.linux-defender.linux-defender
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
add-build-extensions:
  org.freedesktop.Sdk.Extension.node24:
    version: "26.08"
    directory: lib/sdk/node24
  org.freedesktop.Sdk.Extension.rust-stable:
    version: "26.08"
    directory: lib/sdk/rust-stable
command: clamui
# Local developer recipe: builds the checked-out Rust/Tauri source tree.
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  # Work around upstream WebKitGTK Wayland dmabuf protocol errors (#282).
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.x.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --filesystem=xdg-run/gvfsd
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: clamui
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_NET_OFFLINE: "true"
        YARN_ENABLE_NETWORK: "0"
    build-commands:
      - install -Dm644 cargo/config .cargo/config.toml
      - |
        cat > desktop/.yarnrc <<'EOF'
        yarn-offline-mirror "/run/build/clamui/flatpak-node/yarn-mirror"
        yarn-offline-mirror-pruning false
        EOF
      - cd desktop && yarn install --offline --frozen-lockfile --ignore-scripts
      - cd desktop && yarn run check && ./node_modules/.bin/vite build
      - cargo build --offline --locked --release -p clamui --bin clamui
      - cargo build --offline --locked --release -p clamui-core --bin clamui-scheduled-scan
      - install -Dm755 target/release/clamui /app/bin/clamui
      - install -Dm755 target/release/clamui-scheduled-scan /app/bin/clamui-scheduled-scan
      - install -Dm644 data/io.github.linux-defender.linux-defender.desktop /app/share/applications/io.github.linux-defender.linux-defender.desktop
      - install -Dm644 data/io.github.linux-defender.linux-defender.metainfo.xml /app/share/metainfo/io.github.linux-defender.linux-defender.metainfo.xml
      - install -Dm644 icons/io.github.linux-defender.linux-defender.svg /app/share/icons/hicolor/scalable/apps/io.github.linux-defender.linux-defender.svg
      - install -Dm644 icons/io.github.linux-defender.linux-defender.png /app/share/icons/hicolor/128x128/apps/io.github.linux-defender.linux-defender.png
      - install -d /app/share/linux-defender
      - cp -a crates/clamui-core/assets/integrations /app/share/linux-defender/integrations
      - find /app/share/linux-defender/integrations -type f -name '*.sh' -exec chmod 0755 '{}' +
    sources:
      - type: dir
        skip:
          - .git
          - .venv
          - target
          - desktop/node_modules
          - desktop/dist
          - website
          - build-appimage-temp
          - build-appimage-tools
          - dist
        path: ..
      - cargo-sources.json
      - bun-sources.json
