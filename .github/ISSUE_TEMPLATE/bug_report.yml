name: Bug report
description: Report a problem with Linux Defender.
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before reporting a bug. For security vulnerabilities, use GitHub's private vulnerability reporting for this repository if it is enabled; otherwise contact a repository owner privately. Do not post exploit details in a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your Linux Defender version, installation method, Linux distribution and version, architecture, desktop environment, and ClamAV version if relevant.
    validations:
      required: true
  - type: textarea
    id: logs-or-screenshots
    attributes:
      label: Logs or screenshots
      description: Include relevant error output or screenshots. Redact secrets and personal paths before sharing.
    validations:
      required: false
