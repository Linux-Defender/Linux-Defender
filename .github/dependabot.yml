version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "bun"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    groups:
      desktop-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "bun"
    directory: "/website"
    schedule:
      interval: "weekly"
    groups:
      website-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # `astro check` still rejects TypeScript 7. Astro documents TypeScript 6
      # as the supported compiler and experimental support for 7.1+ behind
      # @astrojs/ts-content-mapper. Allow TypeScript 6 updates and drop this
      # rule once the site checker supports 7 by default.
      - dependency-name: "typescript"
        versions:
          - "7.x"
  - package-ecosystem: "bun"
    directory: "/mcp/linux-defender-assist"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
