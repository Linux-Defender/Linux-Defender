name: Build AUR

# AUR is a source recipe rather than a CI-produced binary, so this workflow
# validates that the recipes stay syntactic, rebranded, version-matched, and
# reproducible. It is a separate peer of Build Snap / Build Debian Package.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected commit SHA (optional)
        type: string
  workflow_call:
    inputs:
      expected_sha:
        description: Expected commit SHA (optional)
        type: string
        required: false

# A newer push to the same PR cancels stale checks. Pushes to main, manual
# runs, schedules, and reusable calls keep unique runs and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-aur:
    name: Validate AUR source recipes
    runs-on: ubuntu-24.04
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so check-packaging-consistency.py can prove the AUR
          # source pin is an ancestor of HEAD instead of skipping the check.
          fetch-depth: 0

      - name: Check PKGBUILD syntax
        run: |
          bash -n aur/PKGBUILD
          bash -n aur/linux-defender-privileged-helper/PKGBUILD

      - name: Verify AUR recipes against all packaging contracts
        run: python3 scripts/check-aur-consistency.py

      - name: Write workflow summary
        run: |
          {
            echo "## AUR validation"
            echo "- App recipe: aur/PKGBUILD + .SRCINFO"
            echo "- Helper recipe: aur/linux-defender-privileged-helper/PKGBUILD + .SRCINFO"
            echo "- No engine or signature database is bundled."
          } >> "$GITHUB_STEP_SUMMARY"
