name: Build Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# A newer push to the same PR cancels stale checks. Pushes to main, manual
# runs, schedules, and reusable calls keep unique runs and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-flatpak:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Flatpak SDK extensions
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-info --user flathub org.freedesktop.Sdk.Extension.node24//26.08 >/dev/null
          flatpak remote-info --user flathub org.freedesktop.Sdk.Extension.rust-stable//26.08 >/dev/null
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Sdk.Extension.node24//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08


      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: flathub/io.github.linuxdefender.linuxdefender.local.yml
          bundle: linux-defender-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.runner }}-${{ matrix.arch }}

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-defender-flatpak-${{ matrix.arch }}
          path: linux-defender-${{ matrix.arch }}.flatpak
          retention-days: 7
