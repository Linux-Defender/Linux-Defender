name: Build AppImage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the AppImage with GPG"
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        description: "Sign the AppImage with GPG"
        type: boolean
        default: false
    secrets:
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false

# A newer push to the same PR cancels stale checks. Pushes to main, manual
# runs, schedules, and reusable calls keep unique runs and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo bash .github/workflows/install-ubuntu-build-deps.sh \
            build-essential \
            curl \
            file \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            patchelf \
            squashfs-tools \
            pkg-config \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable


      - name: Install pinned AppImage tool
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" \
            --output appimagetool-x86_64.AppImage
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum --check
          chmod +x appimagetool-x86_64.AppImage
          echo "APPIMAGETOOL=$GITHUB_WORKSPACE/appimagetool-x86_64.AppImage" >> "$GITHUB_ENV"


      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Build AppImage with update metadata
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.sign == true }}
        env:
          UPDATE_INFORMATION: gh-releases-zsync|Linux-Defender|Linux-Defender|latest|Linux-Defender-*-x86_64.AppImage.zsync
        run: ./appimage/build-appimage.sh

      - name: Build AppImage
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.sign != true }}
        run: ./appimage/build-appimage.sh

      - name: Smoke-test native AppImage
        run: |
          set -euo pipefail
          appimage=(Linux-Defender-*-x86_64.AppImage)
          test "${#appimage[@]}" -eq 1
          chmod +x "${appimage[0]}"
          "./${appimage[0]}" --appimage-extract
          test -x squashfs-root/usr/bin/linux-defender
          test -x squashfs-root/usr/bin/linux-defender-scheduled-scan
          test -x squashfs-root/usr/bin/linux-defender-apply-preferences
          squashfs-root/usr/bin/linux-defender --help
          squashfs-root/usr/bin/linux-defender-scheduled-scan --help
          rm -rf squashfs-root

      - name: Import GPG key
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign == true
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
        id: gpg

      - name: Sign AppImage
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign == true
        env:
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          EXPECTED_FINGERPRINT: 28CA212A766A6D51273EBBD277B8EC8622C91282
        run: |
          set -euo pipefail
          public_fingerprint="$(gpg --batch --show-keys --with-colons signing-key.asc | grep '^fpr:' | head -n 1 | cut -d: -f10)"
          test "$public_fingerprint" = "$EXPECTED_FINGERPRINT"
          imported_fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | grep '^fpr:' | head -n 1 | cut -d: -f10)"
          test "$imported_fingerprint" = "$EXPECTED_FINGERPRINT"
          appimage=(Linux-Defender-*-x86_64.AppImage)
          test "${#appimage[@]}" -eq 1
          "./${appimage[0]}" --appimage-extract
          # Re-signing preserves squashfs modes; keep entries readable/traversable.
          chmod -R u+rwX,go+rX,go-w squashfs-root
          sign_args=(--sign --sign-key "$EXPECTED_FINGERPRINT")
          if [[ "${{ startsWith(github.ref, 'refs/tags/') || inputs.sign == true }}" == "true" ]]; then
            sign_args+=(-u "gh-releases-zsync|Linux-Defender|Linux-Defender|latest|Linux-Defender-*-x86_64.AppImage.zsync")
          fi
          "${APPIMAGETOOL}" "${sign_args[@]}" squashfs-root/ "${appimage[0]}"
          signature="${appimage[0]}.sig"
          test -f "$signature"
          keyring="$(mktemp)"
          gpg --batch --export "$EXPECTED_FINGERPRINT" > "$keyring"
          gpgv --keyring "$keyring" "$signature" "${appimage[0]}"
          rm -f "$keyring"
          rm -rf squashfs-root

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-package
          path: |
            Linux-Defender-*-x86_64.AppImage
            Linux-Defender-*-x86_64.AppImage.zsync
            Linux-Defender-*-x86_64.AppImage.sig
          if-no-files-found: error
          retention-days: 7
