name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected commit SHA (optional)
        type: string


# A newer push to the same PR cancels stale checks. Pushes to main, manual
# runs, schedules, and reusable calls keep unique runs and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit locked Rust dependencies
        run: cargo audit

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Verify locked frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Audit frontend dependencies
        working-directory: desktop
        run: bun audit

      - name: Verify locked website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Audit website dependencies
        working-directory: website
        run: bun audit

      - name: Verify locked MCP assist dependencies
        working-directory: mcp/linux-defender-assist
        run: bun install --frozen-lockfile

      - name: Audit MCP assist dependencies
        working-directory: mcp/linux-defender-assist
        run: bun audit
