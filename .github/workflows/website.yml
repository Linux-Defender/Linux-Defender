name: Validate Website

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - "scripts/check-built-links.py"
  workflow_dispatch:

# A newer push to the same PR cancels stale checks. Pushes to main, manual
# runs, schedules, and reusable calls keep unique runs and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Starlight site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.x"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/bun.lock') }}
      - name: Install Chromium for Mermaid rendering
        working-directory: website
        run: bunx playwright install --with-deps chromium

      - name: Check website
        working-directory: website
        run: bun run check

      - name: Build Starlight site
        working-directory: website
        run: bun run build

      - name: Check built local links and anchors
        run: python3 scripts/check-built-links.py website/dist

      - name: Verify Starlight search index
        run: test -f website/dist/pagefind/pagefind.js
