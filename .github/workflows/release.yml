name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to release (must match the dispatch ref)"
        required: true
        type: string

jobs:
  build-deb:
    uses: ./.github/workflows/build-deb.yml
    permissions:
      contents: read
    with:
      sign: true
    secrets: inherit

  build-rpm:
    uses: ./.github/workflows/build-rpm.yml
    permissions:
      contents: read
    with:
      sign: true
    secrets: inherit

  build-appimage:
    uses: ./.github/workflows/build-appimage.yml
    permissions:
      contents: read
    with:
      sign: true
    secrets: inherit

  release:
    needs: [build-deb, build-rpm, build-appimage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Debian package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: debian-packages-*
          merge-multiple: true
          path: debs

      - name: Download RPM helper package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rpm-package-*
          merge-multiple: true
          path: rpms

      - name: Download AppImage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage-package
          path: appimages

      - name: Verify release tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$REQUESTED_TAG" in
            v*) ;;
            *) echo "workflow_dispatch requires an existing v* tag" >&2; exit 1 ;;
          esac
          if [ "$GITHUB_REF" != "refs/tags/$REQUESTED_TAG" ]; then
            echo "dispatch ref $GITHUB_REF does not match tag $REQUESTED_TAG" >&2
            exit 1
          fi

      - name: Read release notes
        id: notes
        run: |
          {
            echo "notes<<EOF"
            tail -n +2 RELEASE_NOTES.md
            printf '\nEOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            debs/linux-defender_*_amd64.deb
            debs/linux-defender-privileged-helper_*_amd64.deb
            debs/linux-defender_*_arm64.deb
            debs/linux-defender-privileged-helper_*_arm64.deb
            rpms/linux-defender-privileged-helper-*.rpm
            rpms/linux-defender-privileged-helper-*.rpm.asc
            appimages/Linux-Defender-*.AppImage
            appimages/Linux-Defender-*.AppImage.zsync
            appimages/Linux-Defender-*.AppImage.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
