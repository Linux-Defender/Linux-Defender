name: Consistency Audit

# Runs the same full audit contributors run locally (scripts/audit-consistency.sh)
# so drift in parity/dead code/stale refs/translations is caught before merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected commit SHA (optional)
        type: string
  schedule:
    - cron: "0 5 * * 1" # Weekly consistency audit, like CodeQL/dependency audit.

# A newer push to the same PR cancels stale checks. Pushes to main, manual
# runs, schedules, and reusable calls keep unique runs and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: Full consistency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          sudo bash .github/workflows/install-ubuntu-build-deps.sh \
            build-essential libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libxdo-dev pkg-config gettext

      - name: Install gettext (explicit, idempotent)
        # Defense in depth: build-deps already installs gettext, but the audit
        # depends on msgfmt/msgcmp/msgmerge/msgen/xgettext/msgcat. Install and
        # verify them explicitly so a missing or stale tool fails fast with a
        # clear message instead of an opaque gettext error deep in the audit.
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          for tool in msgfmt msgcmp msgmerge msgen xgettext msgcat; do
            command -v "$tool" >/dev/null || { echo "missing gettext tool: $tool" >&2; exit 1; }
            "$tool" --version >/dev/null
            echo "  $tool: OK"
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-machete
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: cargo-machete

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: |
          ( cd desktop && bun install --frozen-lockfile )
          ( cd website && bun install --frozen-lockfile )
          ( cd mcp/linux-defender-assist && bun install --frozen-lockfile )

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/bun.lock') }}
      - name: Install Chromium for Mermaid rendering
        working-directory: website
        run: bunx playwright install --with-deps chromium

      - name: Static checks (dead links, dead files, cross-layer parity, skills, gettext)
        run: bash scripts/check-all.sh

      - name: Run full audit (repo, app, site, builds, tests, sync)
        run: bash scripts/audit-consistency.sh
