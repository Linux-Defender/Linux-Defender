name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected commit SHA (optional)
        type: string


# A newer push to the same PR cancels stale checks. Pushes to main, manual
# runs, schedules, and reusable calls keep unique runs and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    name: Core tests (headless)
    runs-on: ubuntu-22.04
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install core build dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Run headless core tests
        run: cargo test -p linux-defender-core --locked

  desktop:
    name: Tauri desktop build
    runs-on: ubuntu-22.04
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Type-check frontend
        working-directory: desktop
        run: bun run check

      - name: Build frontend
        working-directory: desktop
        run: bun run build

      - name: Build Tauri application
        working-directory: desktop
        run: bun run tauri build --no-bundle

  website:
    name: Website build and link validation
    runs-on: ubuntu-22.04
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/bun.lock') }}
      - name: Install Chromium for Mermaid rendering
        working-directory: website
        run: bunx playwright install --with-deps chromium

      - name: Type-check website
        working-directory: website
        run: bun run check

      - name: Build website
        working-directory: website
        run: bun run build

      - name: Validate built-site links
        run: python3 scripts/check-built-links.py website/dist
