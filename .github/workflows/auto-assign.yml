name: Auto Assign

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      # Manual dispatch has no issue/PR payload; verify the trigger succeeds
      # instead of skipping the whole job, then skip only the assign action.
      - name: Verify dispatch trigger
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual dispatch verified; no issue/PR payload to assign."

      - name: Auto-assign new issues and pull requests to the maintainer
        if: github.event_name == 'issues' || github.event_name == 'pull_request'
        uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: Linux-Defender
          numOfAssignee: 1
