name: Auto Assign

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    # Manual dispatch is for trigger verification only; there is no issue/PR
    # payload to assign in that case.
    if: github.event_name == 'issues' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign new issues and pull requests to the maintainer
        uses: pozil/auto-assign-issue@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: Linux-Defender
          numOfAssignee: 1
