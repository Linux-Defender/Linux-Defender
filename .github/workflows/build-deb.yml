name: Build Debian Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the Debian package(s) with GPG"
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        description: "Sign the Debian package(s) with GPG"
        type: boolean
        default: false
    secrets:
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false

# A newer push to the same PR cancels stale checks. Pushes to main, manual
# runs, schedules, and reusable calls keep unique runs and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Verify runner architecture
        run: test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"

      - name: Install native build dependencies
        run: |
          sudo bash .github/workflows/install-ubuntu-build-deps.sh \
            build-essential \
            dpkg-dev \
            dpkg-sig \
            fakeroot \
            gettext \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Build Debian packages
        run: ./debian/build-deb.sh dist

      - name: Import GPG key
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign == true
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
        id: gpg

      - name: Sign Debian packages
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign == true
        run: |
          set -euo pipefail
          shopt -s nullglob
          arch="${{ matrix.architecture }}"
          debs=()
          for package in linux-defender linux-defender-privileged-helper; do
            pattern="dist/${package}_*_${arch}.deb"
            matches=( $pattern )
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one match for $pattern, found ${#matches[@]}" >&2
              exit 1
            fi
            debs+=( "${matches[0]}" )
          done

          dpkg-sig --sign builder -k "${{ steps.gpg.outputs.fingerprint }}" "${debs[@]}"

          for deb in "${debs[@]}"; do
            verification="$(dpkg-sig --verify "$deb")" || {
              printf '%s\n' "$verification" >&2
              exit 1
            }
            printf '%s\n' "$verification"
            grep -q "^GOODSIG _gpgbuilder ${{ steps.gpg.outputs.fingerprint }} " <<< "$verification"
          done

      - name: Upload Debian package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-packages-${{ matrix.architecture }}
          path: |
            dist/linux-defender_*_${{ matrix.architecture }}.deb
            dist/linux-defender-privileged-helper_*_${{ matrix.architecture }}.deb
          if-no-files-found: error
          retention-days: 7
