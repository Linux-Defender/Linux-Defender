name: Build Snap

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "snap/**"
      - "assets/integrations-native/**"
      - "crates/**"
      - "data/**"
      - "desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-snap.yml"
  workflow_dispatch:
  workflow_call:

# A newer push to the same PR cancels stale checks. Pushes to main, manual
# runs, schedules, and reusable calls keep unique runs and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-snap:
    name: Build snap (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Check snap contents
        run: |
          set -euo pipefail
          snap="${{ steps.snapcraft.outputs.snap }}"
          unsquashfs -l "$snap" | grep -q 'squashfs-root/bin/linux-defender$'
          unsquashfs -l "$snap" | grep -q 'squashfs-root/bin/linux-defender-scheduled-scan$'

      - name: Install and run headless CLI
        run: |
          set -euo pipefail
          sudo snap install --dangerous --classic "${{ steps.snapcraft.outputs.snap }}"
          /snap/bin/linux-defender --help >/dev/null

      - name: Upload snap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-${{ matrix.architecture }}
          path: ${{ steps.snapcraft.outputs.snap }}
