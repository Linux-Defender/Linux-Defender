name: Translations

on:
  push:
    branches: [main]
    paths:
      - "po/**"
      - "crates/linux-defender-core/**"
      - "desktop/src/**"
      - "desktop/src-tauri/src/**"
      - "desktop/package.json"
      - "desktop/bun.lock"
      - "scripts/check-translations.sh"
      - "scripts/check-compiled-catalogs.ts"
      - "scripts/check-potfiles.sh"
      - "scripts/update-pot.sh"
      - "scripts/generate-translation-review.py"
      - "scripts/extract-typescript-gettext.ts"
      - ".github/workflows/i18n.yml"
  pull_request:
    branches: [main]
    paths:
      - "po/**"
      - "crates/linux-defender-core/**"
      - "desktop/src/**"
      - "desktop/src-tauri/src/**"
      - "desktop/package.json"
      - "desktop/bun.lock"
      - "scripts/check-translations.sh"
      - "scripts/check-compiled-catalogs.ts"
      - "scripts/check-potfiles.sh"
      - "scripts/update-pot.sh"
      - "scripts/generate-translation-review.py"
      - ".github/workflows/i18n.yml"
      - "scripts/extract-typescript-gettext.ts"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected commit SHA (optional)
        type: string


# A newer push to the same PR cancels stale checks. Pushes to main, manual
# runs, schedules, and reusable calls keep unique runs and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-translations:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Verify gettext tools
        run: |
          for tool in msgfmt msgcmp msgmerge msgen xgettext msgcat; do
            command -v "$tool" >/dev/null || { echo "missing gettext tool: $tool" >&2; exit 1; }
            "$tool" --version >/dev/null
          done

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Verify locked frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Validate human-review report is current
        run: python3 scripts/generate-translation-review.py --check

      - name: Validate catalog files
        run: ./scripts/check-translations.sh

      - name: Validate Rust and TypeScript catalog coverage
        run: ./scripts/check-potfiles.sh

      - name: Verify generated catalog is current
        run: ./scripts/update-pot.sh --check
