name: Proof HTML

# Adapted from the Linux-Guardians org demo repo. Runs on demand because the
# published site uses the repository-page base path (/Linux-Defender/), which
# check-built-links.py (website.yml) validates in a base-path-aware way.
# proof-html is kept for additional structural HTML checks (DOCTYPE, duplicate
# IDs, alt text) when run manually against a locally built site.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-html:
    name: Validate built site HTML (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/bun.lock') }}
      - name: Install Chromium for Mermaid rendering
        working-directory: website
        run: bunx playwright install --with-deps chromium

      - name: Build website
        working-directory: website
        run: bun run build

      - name: Prepare base-path-aware HTML copy
        # proof-html resolves absolute links against the filesystem. The site
        # is deployed under /Linux-Defender/, so rewrite that prefix in a
        # throwaway CI copy before validating structure.
        run: |
          mkdir -p website/proof
          cp -a website/dist/. website/proof/
          find website/proof -type f -name '*.html' -exec sed -i \
            -e 's|https://linux-defender.github.io/Linux-Defender/|https://linux-defender.github.io/|g' \
            -e 's|"/Linux-Defender/|"/|g' \
            -e "s|'/Linux-Defender/|'/|g" \
            -e 's/\x7F//g' {} +

      - name: Proof built HTML
        uses: anishathalye/proof-html@f060b7619c2410bd85d970459a60ef431cf47ed5 # v2.2.5
        with:
          directory: ./website/proof
          # v2's Nu validator rejects Starlight/Shiki generated inline custom
          # properties and markup. The enforced equivalent is our own
          # scripts/check-built-links.py (DOCTYPE, duplicate IDs, image alt,
          # inline style declarations, CSS block balance) run by website.yml
          # and the full audit; HTML-Proofer below checks links and assets.
          check_html: false
          check_css: false
          ignore_empty_alt: true
          # External links are validated by scripts/check-external-links.py;
          # proof-html focuses on local structure and assets. v2 renamed the
          # ignore inputs: ignore_url_re / ignore_empty_alt / disable_external.
          disable_external: true
