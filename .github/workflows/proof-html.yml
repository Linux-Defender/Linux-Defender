name: Proof HTML

# Adapted from the Linux-Guardians org demo repo. Runs on demand because the
# published site uses the repository-page base path (/Linux-Defender/), which
# check-built-links.py (website.yml) validates in a base-path-aware way.
# proof-html is kept for additional structural HTML checks (DOCTYPE, duplicate
# IDs, alt text) when run manually against a locally built site.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-html:
    name: Validate built site HTML (manual)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/bun.lock') }}
      - name: Install Chromium for Mermaid rendering
        working-directory: website
        run: bunx playwright install --with-deps chromium

      - name: Build website
        working-directory: website
        run: bun run build

      - name: Prepare base-path-aware HTML copy
        # proof-html resolves absolute links against the filesystem. The site
        # is deployed under /Linux-Defender/, so rewrite that prefix in a
        # throwaway CI copy before validating structure.
        run: |
          mkdir -p website/proof
          cp -a website/dist/. website/proof/
          find website/proof -type f -name '*.html' -exec sed -i -e 's|/Linux-Defender/|/|g' -e 's/\x7F//g' {} +

      - name: Proof built HTML
        uses: anishathalye/proof-html@v2.2.5
        with:
          directory: ./website/proof
          check_html: true
          empty_alt_ignore: true
          # External links are validated by scripts/check-external-links.py;
          # proof-html focuses on local structure and assets.
          url_ignore_re: |
            ^https?://
        env:
          DO_NOT_CHECK_WWW: "true"
