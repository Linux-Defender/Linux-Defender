[package]
name = "linux-defender"
version = "0.6.0"
edition = "2021"
description = "Linux Defender desktop runtime"
license = "MIT"
default-run = "linux-defender"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "linux-defender"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
linux-defender-core = { path = "../../crates/linux-defender-core" }
ksni = "0.3.6"
open = "5"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
url = "2"
